<header>
  <div class="clock">{{ clock() }}</div>
  <div class="date">{{ dateLabel() }}</div>
</header>

<div class="section-title">Nästa avgångar</div>

<div class="list">
  @for (d of upcoming(); track d.key) {
    <div class="dep" [class.unreachable]="!d.reachable">
      <div class="line">{{ d.line }}</div>
      <div class="info">
        <div class="dest">{{ d.direction }}</div>
        <div class="time">{{ d.time }}</div>
      </div>
      <div class="eta {{ d.etaClass }}">
        @if (d.mins < 1) {
          <div class="num">Nu</div>
        } @else {
          <div class="num">{{ d.mins }}</div>
          <div class="unit">min</div>
        }
      </div>
    </div>
  } @empty {
    <div class="empty">Inga fler avgångar</div>
  }
</div>

<div class="status" [class.error]="offline()">
  @if (offline()) { Ingen kontakt, visar senaste data }
</div>
