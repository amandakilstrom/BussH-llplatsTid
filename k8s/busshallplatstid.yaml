apiVersion: apps/v1
kind: Deployment
metadata:
  name: busshallplatstid
  namespace: busshallplatstid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busshallplatstid
  template:
    metadata:
      labels:
        app: busshallplatstid
    spec:
      containers:
        - name: busshallplatstid
          image: docker.io/library/busshallplatstid:v1
          imagePullPolicy: Never   # imagen importeras manuellt, ingen registry
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: busshallplatstid   # skapas från .env med kubectl
          readinessProbe:
            tcpSocket:
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: busshallplatstid
  namespace: busshallplatstid
spec:
  type: LoadBalancer   # k3s ServiceLB öppnar porten direkt på noden
  selector:
    app: busshallplatstid
  ports:
    - port: 8080
      targetPort: 8080
