# Grafana-dashboard för infomonitor-skärmen (720x1280 stående).
# Grafanas sidecar läser in alla ConfigMaps med etiketten grafana_dashboard="1".
# Läggs in med: kubectl apply -f dashboard-infomonitor.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-infomonitor
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  infomonitor.json: |-
    {
      "uid": "infomonitor",
      "title": "Infomonitor",
      "tags": [
        "infomonitor"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "schemaVersion": 39,
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "homelab",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "CPU",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 5
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{instance=\"192.168.50.211:9100\",mode=\"idle\"}[2m])))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "Minne",
