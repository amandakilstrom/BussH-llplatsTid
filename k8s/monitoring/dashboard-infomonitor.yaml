                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - node_memory_MemAvailable_bytes{instance=\"192.168.50.211:9100\"} / node_memory_MemTotal_bytes{instance=\"192.168.50.211:9100\"})",
